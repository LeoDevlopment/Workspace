<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HR Service{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">HR Service</a>
    {% if user is defined and user %}
    <div class="ms-auto d-flex align-items-center gap-3 text-white">
      <a class="text-white text-decoration-none" href="/users/me">{{ user.full_name }}</a>
      <form method="post" action="/auth/logout" class="m-0">
        <button class="btn btn-outline-light btn-sm" type="submit">Выйти</button>
      </form>
    </div>
    {% endif %}
  </div>
</nav>

<main class="container">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
