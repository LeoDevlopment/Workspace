{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Смена пароля</h1>
        {% if forced %}
        <div class="alert alert-warning">
          Необходимо сменить пароль перед продолжением работы.
        </div>
        {% endif %}
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post" action="/auth/change-password">
          <div class="mb-3">
            <label class="form-label">Текущий пароль</label>
            <input class="form-control" name="current_password" type="password" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Новый пароль</label>
            <input class="form-control" name="new_password" type="password" required minlength="8">
            <div class="form-text">Минимум 8 символов.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Повторите новый пароль</label>
            <input class="form-control" name="confirm_password" type="password" required minlength="8">
          </div>
          <button class="btn btn-primary w-100" type="submit">Сохранить</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
